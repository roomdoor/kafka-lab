services:
  # KRaft 모드 단일 브로커. Zookeeper 없음 (Kafka 4.x 부터 Zookeeper 제거됨)
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-lab-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 컨테이너 내부(kafka:29092)와 호스트(localhost:9092)에서 각각 접속하려면 리스너가 두 개 필요하다.
      # 하나로 합치면 둘 중 한쪽에서 반드시 접속이 깨진다 — Kafka 입문자가 가장 많이 막히는 지점.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # 단일 브로커라 복제본은 1개까지만 가능하다. 운영에서는 3 이상.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 컨슈머가 붙을 때 리밸런스를 지연 없이 시작 (로컬 실습용, 운영 기본값은 3000)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 오타 난 토픽 이름이 조용히 생성되는 사고를 막는다. 운영에서도 false 가 정석.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12

  # 토픽/파티션/컨슈머 랙을 눈으로 확인하는 용도. http://localhost:8081
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-lab-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: kafka-lab-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: kafkalab
      POSTGRES_USER: kafkalab
      POSTGRES_PASSWORD: kafkalab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafkalab"]
      interval: 5s
      timeout: 5s
      retries: 10
